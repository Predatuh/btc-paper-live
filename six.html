<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Six $1000 paper desks</title>
  <style>
    :root { --bg:#090b0e; --text:#eef3f7; --muted:#8b98a5; --up:#3ddc8e; --down:#ff5d73; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .top { padding:18px 18px 8px; }
    h1 { margin:0 0 6px; font-size:24px; }
    .sub { color:var(--muted); font-size:13px; }
    .market { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:10px 18px 14px; }
    .chip { background:#14181e; border:1px solid #232a33; border-radius:12px; padding:10px 12px; }
    .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .v { font-size:22px; font-weight:700; margin-top:4px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:0 12px 24px; }
    .desk { background:#12161c; border:1px solid #232a33; border-radius:14px; padding:14px; }
    .tag { font-size:11px; font-weight:700; letter-spacing:.06em; }
    .bank { font-size:28px; font-weight:800; margin:6px 0 4px; }
    .pos { color:var(--up); } .neg { color:var(--down); }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    th,td { text-align:left; padding:5px 3px; border-bottom:1px solid #243040; }
    th { color:var(--muted); font-weight:500; }
    .s { color:var(--muted); font-size:12px; line-height:1.4; }
    @media (max-width:900px) { .grid,.market { grid-template-columns:1fr 1fr; } }
    @media (max-width:560px) { .grid,.market { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="top">
    <h1>Six $1,000 paper desks</h1>
    <div class="sub"><span id="live">•</span> Same BTC 5m market. <span id="stamp">loading…</span></div>
  </div>
  <div class="market">
    <div class="chip"><div class="k">BTC</div><div class="v" id="spot">—</div></div>
    <div class="chip"><div class="k">Time left</div><div class="v" id="remain">—</div></div>
    <div class="chip"><div class="k">UP</div><div class="v pos" id="upAsk">—</div></div>
    <div class="chip"><div class="k">DOWN</div><div class="v neg" id="downAsk">—</div></div>
  </div>
  <div class="grid" id="desks"></div>
  <script>
    const BASE = "https://raw.githubusercontent.com/Predatuh/btc-paper-live/master/";
    const DESKS = [
      { id:"c_tight", file:"paper_c1.json", tag:"C1 TIGHT", rule:"p≥64% · 15bp · wait 25s" },
      { id:"conservative", file:"paper.json", tag:"C2 CONSERVATIVE", rule:"p≥62% · 12bp · wait 20s" },
      { id:"c_plus", file:"paper_c3.json", tag:"C3 PLUS", rule:"p≥58% · 8bp · wait 15s" },
      { id:"aggressive", file:"paper_agg.json", tag:"A1 AGGRESSIVE", rule:"p≥56% · 7bp · wait 20s" },
      { id:"a_plus", file:"paper_a2.json", tag:"A2 PLUS", rule:"p≥53% · 4bp · wait 10s" },
      { id:"spray", file:"paper_spray.json", tag:"A3 SPRAY", rule:"p≥51% · 1.5bp · almost all candle" }
    ];
    async function j(url) {
      const r = await fetch(url + "?t=" + Date.now(), { cache:"no-store" });
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }
    const money = n => "$" + Number(n).toFixed(2);
    const cls = n => n >= 0 ? "pos" : "neg";
    function card(meta, s) {
      if (!s) return `<section class="desk"><div class="tag">${meta.tag}</div><div class="bank">no data</div></section>`;
      const start = s.starting_bankroll || 1000;
      const br = Number(s.bankroll);
      const pnl = br - start;
      const trades = s.trades || [];
      const wins = trades.filter(t => Number(t.pnl) > 0).length;
      const pos = s.open_position;
      const rows = trades.slice().reverse().slice(0,8).map(t =>
        `<tr><td>${(t.closed_at||"").replace("T"," ").slice(5,16)}</td><td>${t.side}</td><td class="${cls(t.pnl)}">${Number(t.pnl)>=0?"+":""}${Number(t.pnl).toFixed(2)}</td></tr>`
      ).join("") || `<tr><td colspan="3">No trades yet</td></tr>`;
      const skip = ((s.skips||[]).slice(-1)[0]||{}).reason || "";
      return `<section class="desk">
        <div class="tag">${meta.tag}</div>
        <div class="bank">${money(br)}</div>
        <div class="s"><span class="${cls(pnl)}">${pnl>=0?"+":""}${pnl.toFixed(2)} (${((br/start-1)*100).toFixed(2)}%)</span> · ${wins}/${trades.length} wins</div>
        <div class="s">${meta.rule}</div>
        <div class="s">${pos ? ("OPEN "+pos.side+" @ "+pos.entry_ask+" "+money(pos.cost)) : "Flat"} ${skip?("· "+skip):""}</div>
        <table><thead><tr><th>Closed</th><th>Side</th><th>PnL</th></tr></thead><tbody>${rows}</tbody></table>
      </section>`;
    }
    async function paper() {
      const parts = await Promise.all(DESKS.map(async d => {
        try { return [d, await j(BASE + d.file)]; } catch (e) { return [d, null]; }
      }));
      document.getElementById("desks").innerHTML = parts.map(([d,s]) => card(d,s)).join("");
      const ts = (parts.find(([,s]) => s && s.updated_at) || [null,{}])[1].updated_at || "";
      document.getElementById("stamp").textContent = "book " + String(ts).replace("T"," ").replace("+00:00","Z");
    }
    async function live() {
      const start = Math.floor(Date.now()/1000/300)*300;
      document.getElementById("remain").textContent = Math.max(start+300-Math.floor(Date.now()/1000),0)+"s";
      const ticker = await j("https://api.exchange.coinbase.com/products/BTC-USD/ticker");
      document.getElementById("spot").textContent = Number(ticker.price).toLocaleString(undefined,{maximumFractionDigits:2});
      let up=null, down=null;
      try {
        const mkts = await j("https://gamma-api.polymarket.com/markets?slug=btc-updown-5m-"+start);
        const m = Array.isArray(mkts)?mkts[0]:mkts;
        let prices = m && m.outcomePrices;
        if (typeof prices==="string") prices=JSON.parse(prices);
        if (prices && prices.length>=2) { up=Number(prices[0]); down=Number(prices[1]); }
      } catch(e) {}
      document.getElementById("upAsk").textContent = (up==null||Number.isNaN(up))?"—":Number(up).toFixed(2);
      document.getElementById("downAsk").textContent = (down==null||Number.isNaN(down))?"—":Number(down).toFixed(2);
      document.getElementById("live").style.color = "#3ddc8e";
    }
    async function tick() {
      try { await live(); } catch(e) { document.getElementById("live").style.color="#ff5d73"; }
      try { await paper(); } catch(e) {}
    }
    tick();
    setInterval(tick, 8000);
  </script>
</body>
</html>
