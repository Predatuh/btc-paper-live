<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two paper desks</title>
  <style>
    :root {
      --bg: #090b0e;
      --text: #eef3f7;
      --muted: #8b98a5;
      --up: #3ddc8e;
      --down: #ff5d73;
      --cons: #3d7cff;
      --agg: #ff8a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .top { padding: 22px 22px 10px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { color: var(--muted); }
    .market {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 12px 22px 18px;
    }
    .chip { background: #14181e; border: 1px solid #232a33; border-radius: 12px; padding: 12px 14px; }
    .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 60vh; border-top: 1px solid #232a33; }
    .desk { padding: 20px; }
    .desk.cons { background: #0c121c; border-right: 1px solid #232a33; }
    .desk.agg { background: #17110c; }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      padding: 4px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .cons .tag { background: #16356e; color: #9cbcff; }
    .agg .tag { background: #6a3512; color: #ffc49a; }
    .bank { font-size: 40px; font-weight: 800; }
    .pos { color: var(--up); }
    .neg { color: var(--down); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 14px; }
    th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid #243040; }
    th { color: var(--muted); font-weight: 500; }
    .rules { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 6px 0 10px; }
    @media (max-width: 900px) {
      .split, .market { grid-template-columns: 1fr; }
      .desk.cons { border-right: 0; border-bottom: 1px solid #232a33; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Two paper desks</h1>
    <div class="sub"><span id="live">•</span> Same BTC 5-minute market. Separate fake bankrolls. No real orders.</div>
  </div>
  <div class="market">
    <div class="chip"><div class="k">BTC spot</div><div class="v" id="spot">—</div></div>
    <div class="chip"><div class="k">Time left</div><div class="v" id="remain">—</div></div>
    <div class="chip"><div class="k">UP ask</div><div class="v pos" id="upAsk">—</div></div>
    <div class="chip"><div class="k">DOWN ask</div><div class="v neg" id="downAsk">—</div></div>
  </div>
  <div class="split">
    <section class="desk cons">
      <div class="tag">CONSERVATIVE</div>
      <div class="bank" id="cBank">—</div>
      <div class="rules" id="cMeta">v3: wait 20s · p≥62% · 12bp · z≥1.0 · 40–58¢</div>
      <div id="cOpen">Flat</div>
      <div class="rules" id="cSkip"></div>
      <table>
        <thead><tr><th>Closed</th><th>Side</th><th>Ask</th><th>Win</th><th>PnL</th></tr></thead>
        <tbody id="cTrades"></tbody>
      </table>
    </section>
    <section class="desk agg">
      <div class="tag">AGGRESSIVE</div>
      <div class="bank" id="aBank">—</div>
      <div class="rules" id="aMeta">v3: wait 25s · p≥60% · 10bp · z≥0.80 · 36–62¢</div>
      <div id="aOpen">Flat</div>
      <div class="rules" id="aSkip"></div>
      <table>
        <thead><tr><th>Closed</th><th>Side</th><th>Ask</th><th>Win</th><th>PnL</th></tr></thead>
        <tbody id="aTrades"></tbody>
      </table>
    </section>
  </div>
  <script>
    const BASE = "https://raw.githubusercontent.com/Predatuh/btc-paper-live/master/";
    async function j(url) {
      const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }
    const money = n => "$" + Number(n).toFixed(2);
    const cls = n => n >= 0 ? "pos" : "neg";
    function fill(prefix, s) {
      if (!s) {
        document.getElementById(prefix + "Bank").textContent = "no data";
        return;
      }
      const start = s.starting_bankroll || 100;
      const br = Number(s.bankroll);
      const pnl = br - start;
      const trades = s.trades || [];
      const wins = trades.filter(t => t.pnl > 0).length;
      document.getElementById(prefix + "Bank").innerHTML = money(br);
      document.getElementById(prefix + "Meta").innerHTML =
        `<span class="${cls(pnl)}">${pnl>=0?"+":""}${pnl.toFixed(2)} (${((br/start-1)*100).toFixed(2)}%)</span>` +
        ` · ${wins}/${trades.length} wins · max DD ${((s.max_dd||0)*100).toFixed(1)}%`;
      const pos = s.open_position;
      document.getElementById(prefix + "Open").textContent = pos
        ? ("OPEN " + pos.side + " @ " + pos.entry_ask + "  p=" + pos.p_model + "  cost " + money(pos.cost))
        : "Flat — no open bet";
      const skip = (s.skips || []).slice(-1)[0];
      document.getElementById(prefix + "Skip").textContent = skip ? ("Last skip: " + skip.reason) : "";
      document.getElementById(prefix + "Trades").innerHTML = trades.slice().reverse().map(t =>
        `<tr><td>${(t.closed_at||"").replace("T"," ").slice(0,19)}</td><td>${t.side}</td><td>${t.entry_ask}</td><td>${t.winner}</td><td class="${cls(t.pnl)}">${t.pnl>=0?"+":""}${Number(t.pnl).toFixed(2)}</td></tr>`
      ).join("") || `<tr><td colspan="5">No trades yet</td></tr>`;
    }
    async function paper() {
      let board = {};
      try { board = await j(BASE + "desks.json"); } catch (e) {}
      if (!board.conservative) {
        try { board.conservative = await j(BASE + "paper.json"); } catch (e) {}
      }
      if (!board.aggressive) {
        try { board.aggressive = await j(BASE + "paper_agg.json"); } catch (e) {}
      }
      fill("c", board.conservative);
      fill("a", board.aggressive);
    }
    async function live() {
      const start = Math.floor(Date.now() / 1000 / 300) * 300;
      document.getElementById("remain").textContent = Math.max(start + 300 - Math.floor(Date.now()/1000), 0) + "s";
      const ticker = await j("https://api.exchange.coinbase.com/products/BTC-USD/ticker");
      document.getElementById("spot").textContent = Number(ticker.price).toLocaleString(undefined, {maximumFractionDigits: 2});
      let up = null, down = null;
      try {
        const mkts = await j("https://gamma-api.polymarket.com/markets?slug=btc-updown-5m-" + start);
        const m = Array.isArray(mkts) ? mkts[0] : mkts;
        let prices = m && m.outcomePrices;
        if (typeof prices === "string") prices = JSON.parse(prices);
        if (prices && prices.length >= 2) {
          up = Number(prices[0]);
          down = Number(prices[1]);
        }
        let ids = m && m.clobTokenIds;
        if (typeof ids === "string") ids = JSON.parse(ids);
        if (ids && ids.length >= 2) {
          const books = await Promise.allSettled([
            j("https://clob.polymarket.com/book?token_id=" + ids[0]),
            j("https://clob.polymarket.com/book?token_id=" + ids[1])
          ]);
          const bestAsk = book => {
            const xs = ((book && book.asks) || []).map(x => Number(x.price ?? x[0])).filter(n => n > 0);
            return xs.length ? Math.min(...xs) : null;
          };
          if (books[0].status === "fulfilled") up = bestAsk(books[0].value) ?? up;
          if (books[1].status === "fulfilled") down = bestAsk(books[1].value) ?? down;
        }
      } catch (e) {}
      if (up == null || down == null) {
        try {
          const q = await j(BASE + "live_quote.json");
          if (up == null && q.up_ask != null) up = Number(q.up_ask);
          if (down == null && q.down_ask != null) down = Number(q.down_ask);
        } catch (e) {}
      }
      document.getElementById("upAsk").textContent = (up == null || Number.isNaN(up)) ? "—" : Number(up).toFixed(2);
      document.getElementById("downAsk").textContent = (down == null || Number.isNaN(down)) ? "—" : Number(down).toFixed(2);
      document.getElementById("live").style.color = "#3ddc8e";
    }
    async function tick() {
      try { await live(); } catch (e) { document.getElementById("live").style.color = "#ff5d73"; }
      try { await paper(); } catch (e) {}
    }
    tick();
    setInterval(tick, 8000);
  </script>
</body>
</html>
